<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | Huge Recruitment</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1E3A5F",
              "on-primary": "#FFFFFF",
              "primary-container": "#D6E4FF",
              "on-primary-container": "#001B3D",
              secondary: "#3E6083",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#D1E4FF",
              "on-secondary-container": "#001D36",
              tertiary: "#1E3A5F",
              "on-tertiary": "#FFFFFF",
              surface: "#f8f9ff",
              "on-surface": "#191C20",
              "surface-variant": "#DFE2EB",
              "on-surface-variant": "#43474E",
              outline: "#73777F",
              "outline-variant": "#C3C6CF",
              background: "#f8f9ff",
              "on-background": "#191C20",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#eff4ff",
              "surface-container": "#F0F3F8",
              "surface-container-high": "#EAEFF5",
              "surface-container-highest": "#E4E9EF",
              "inverse-primary": "#B0D3EF",
              "inverse-surface": "#2E3135",
              "inverse-on-surface": "#F0F0F4",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              xl: "48px",
              md: "16px",
              gutter: "24px",
              sm: "8px",
              "container-max": "1200px",
              xxl: "80px",
              xs: "4px",
              lg: "24px",
              base: "4px",
            },
            fontFamily: {
              caption: ["Hanken Grotesk"],
              "label-md": ["Hanken Grotesk"],
              "headline-md": ["Hanken Grotesk"],
              "headline-lg": ["Hanken Grotesk"],
              "body-lg": ["Hanken Grotesk"],
              "display-lg": ["Hanken Grotesk"],
              "body-md": ["Hanken Grotesk"],
              "display-lg-mobile": ["Hanken Grotesk"],
              headline: ["Hanken Grotesk"],
              display: ["Hanken Grotesk"],
              body: ["Hanken Grotesk"],
              label: ["Hanken Grotesk"],
            },
            fontSize: {
              caption: ["12px", { lineHeight: "16px", fontWeight: "400" }],
              "label-md": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.05em",
                  fontWeight: "500",
                },
              ],
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "display-lg-mobile": [
                "36px",
                {
                  lineHeight: "44px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Hanken Grotesk", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .login-card-shadow {
        box-shadow: 0 4px 20px -2px rgba(30, 58, 95, 0.08);
      }
    </style>
  </head>
  <body class="bg-background text-on-background min-h-screen flex flex-col">
    <!-- Main Content: Login Section -->
    <main
      class="flex-grow flex items-center justify-center pt-20 pb-xxl px-gutter"
    >
      <div
        class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700"
      >
        <!-- Login Card -->
        <div
          class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl login-card-shadow"
        >
          <div class="mb-xl text-center">
            <h1 class="font-headline-lg text-headline-lg text-primary mb-sm">
              Welcome back
            </h1>
            <p class="font-body-md text-body-md text-secondary">
              Elevate your career with specialist guidance
            </p>
          </div>
          <!-- Login Form -->
          <form class="space-y-lg" onsubmit="event.preventDefault()">
            <div class="space-y-xs">
              <label
                class="font-label-md text-label-md text-on-surface-variant block"
                for="email"
                >Email Address</label
              >
              <input
                class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all duration-200"
                id="email"
                placeholder="e.g. james.smith@corporate.com"
                type="email"
              />
            </div>
            <div class="space-y-xs">
              <div class="flex justify-between items-center">
                <label
                  class="font-label-md text-label-md text-on-surface-variant block"
                  for="password"
                  >Password</label
                >
                <a
                  class="font-label-md text-label-md text-primary hover:underline transition-all"
                  href="#"
                  >Forgot Password?</a
                >
              </div>
              <input
                class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all duration-200"
                id="password"
                placeholder="••••••••"
                type="password"
              />
            </div>
            <button
              class="w-full h-12 bg-primary text-on-primary font-body-md text-body-md font-bold rounded-lg hover:bg-secondary hover:text-on-secondary transition-all duration-300 shadow-md"
              type="submit"
            >
              Sign In
            </button>
          </form>
          <!-- Divider -->
          <div class="relative my-xl">
            <div class="absolute inset-0 flex items-center">
              <span class="w-full border-t border-outline-variant"></span>
            </div>
            <div class="relative flex justify-center text-caption font-caption">
              <span
                class="bg-surface-container-lowest px-md text-on-surface-variant"
                >Or continue with</span
              >
            </div>
          </div>
          <!-- Social Login -->
          <div class="">
            <button
              class="h-12 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-all duration-200"
            >
              <span class="material-symbols-outlined text-[20px] text-primary"
                >G</span
              >
              <span class="font-label-md text-label-md text-on-surface"
                >Continue with Google</span
              >
            </button>
          </div>
          <div class="mt-xl text-center">
            <p class="font-body-md text-body-md text-secondary">
              New to Huge Recruitment?
              <a class="text-primary font-bold hover:underline" href="#"
                >Register now</a
              >
            </p>
          </div>
        </div>

      </div>
    </main>
    <!-- Footer -->
    <script>
      // Micro-interaction for input fields
      const inputs = document.querySelectorAll("input");
      inputs.forEach((input) => {
        input.addEventListener("focus", () => {
          const label = input.parentElement.querySelector("label");
          if (label) label.classList.add("text-primary");
        });
        input.addEventListener("blur", () => {
          const label = input.parentElement.querySelector("label");
          if (label) label.classList.remove("text-primary");
        });
      });
    </script>
  </body>
</html>
